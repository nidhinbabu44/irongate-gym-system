version: '3.8'

services:
  # Microsoft SQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "GymSystem@2024"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "GymSystem@2024" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DB_SERVER: mssql
      DB_PORT: 1433
      DB_DATABASE: GymEntrySystem
      DB_USER: sa
      DB_PASSWORD: GymSystem@2024
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERT: "true"
      JWT_SECRET: change-this-in-production-please
      PORT: 5000
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mssql_data:
  uploads_data:
